[package]
name = "horizon-soft_landing"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "The local player never takes fall damage; everyone else keeps vanilla. A Horizon native mod."
publish = false

# The runtime doubles as the mod's library (its tests) and the module the
# bundle injects into the game; the helper files compile only inside it.
[lib]
path = "mixins/soft_landing/runtime.rs"
