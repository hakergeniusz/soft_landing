# Soft Landing: fall damage never lands. A Hooks-only native mod: the
# living_fall hook cancels fall handling wherever this machine ticks the
# falling entity - the local single-player world and every player on a
# hosted LAN world.
id = "soft_landing"
name = "Soft Landing"
version = "1.3.0"
description = "Fall damage never lands: you - and, on a hosted LAN world, your guests - take nothing from any fall."
authors = ["hakergeniusz"]
license = "MIT"
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f037744a79f9982c47876f49c5a3067279f88706"
